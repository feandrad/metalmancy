tasks.register('generateRecipes', JavaExec) {
    group = 'recipegen'
    description = 'Generates recipe json from the RecipeEntries list'
    mainClass = 'tools.recipegen.RecipeGenKt'
    classpath = sourceSets.main.runtimeClasspath
    args '--out', "$buildDir/generated/data"
    doFirst { println "→ Generating recipe json at $buildDir/generated/data ..." }
}

tasks.register('syncGeneratedRecipes', Copy) {
    group = 'recipegen'
    description = 'Copies the generated recipes to resources'
    from "$buildDir/generated/data"
    into '../common/src/main/resources/data'
    dependsOn 'generateRecipes'
}

tasks.named('generateRecipes') {
    dependsOn 'cleanGeneratedAssets'
}

tasks.register('cleanRecipegenResources', Delete) {
    group = 'recipegen'
    description = 'Removes old assets already copied in src/main/resources/data'
    delete("../common/src/main/resources/data/${rootProject.name.toLowerCase()}/recipes")
}

tasks.register('forceRecreateRecipes') {
    group = 'recipegen'
    description = 'Forces complete recreation of recipe assets: cleans resources, cleans generated, generates JSONs and syncs.'

    dependsOn 'cleanRecipegenResources'
    dependsOn 'generateRecipes'
    dependsOn 'syncGeneratedRecipes'
}

tasks.named('syncGeneratedAll') {
    dependsOn 'syncGeneratedRecipes'
}
